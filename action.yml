---
name: Run ruff with reviewdog
description: |
  🐶 Run ruff with reviewdog on pull requests to improve code review experience.
author: Nerijus Bendžiūnas
inputs:
  github_token:
    description: GITHUB_TOKEN
    default: ${{ github.token }}
  workdir:
    description: Working directory relative to the root directory.
    default: .
  ruff_version:
    description: |
      ruff version to install. Leave empty to use the version pinned in the
      project's pyproject.toml, requirements.txt or uv.lock, or latest when
      none is pinned.
    default: ''
  ### Flags for reviewdog  ###
  level:
    description: Report level for reviewdog [info,warning,error]
    default: error
  reporter:
    description: |
      Reporter of reviewdog command
      [github-pr-check,github-check,github-pr-review].
    default: github-pr-check
  filter_mode:
    description: |
      Filtering mode for the reviewdog command
      [added,diff_context,file,nofilter].
      Default is added.
    default: added
  fail_level:
    description: |
      If set to `none`, always use exit code 0 for reviewdog. Otherwise, exit
      code 1 for reviewdog if it finds at least 1 issue with severity greater
      than or equal to the given level.
      Possible values: [none,any,info,warning,error]
      Default is `none`.
    default: none
  ruff_args:
    description: Additional arguments to pass to ruff
    default: ''
  reviewdog_flags:
    description: Additional reviewdog flags
    default: ''
runs:
  using: composite
  steps:
    # yamllint disable-line rule:line-length
    - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f  # v1.5.0
      with:
        reviewdog_version: v0.21.1
    # yamllint disable-line rule:line-length
    - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
      with:
        args: --version
        src: ${{ inputs.workdir }}
        version: ${{ inputs.ruff_version }}
    - run: $GITHUB_ACTION_PATH/script.sh
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_WORKDIR: ${{ inputs.workdir }}
        INPUT_LEVEL: ${{ inputs.level }}
        INPUT_REPORTER: ${{ inputs.reporter }}
        INPUT_FILTER_MODE: ${{ inputs.filter_mode }}
        INPUT_FAIL_LEVEL: ${{ inputs.fail_level }}
        INPUT_RUFF_ARGS: ${{ inputs.ruff_args }}
        INPUT_REVIEWDOG_FLAGS: ${{ inputs.reviewdog_flags }}
branding:
  icon: zap
  color: red
